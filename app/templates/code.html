{% extends "base.html" %}
{% block title %}Код входа — Транскрибер{% endblock %}
{% block body_class %}auth{% endblock %}
{% block body %}
<main class="auth-card">
  <img class="auth-logo" src="/static/icons/icon-192.png" alt="" width="64" height="64">
  <h1>Код из приложения</h1>
  <p class="muted">Откройте приложение-аутентификатор и введите 6 цифр.</p>
  {% if error %}<p class="notice notice-error" role="alert">{{ error }}</p>{% endif %}
  <form method="post" action="/login/code" class="stack">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <label class="field">
      <span>Код</span>
      <input name="code" class="code-input" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9 ]*" maxlength="7" required autofocus>
    </label>
    <label class="check">
      <input type="checkbox" name="remember" value="1" checked>
      <span>Запомнить это устройство на 90 дней</span>
    </label>
    <button class="btn btn-primary btn-block" type="submit">Подтвердить</button>
  </form>
  <p><a class="link" href="/login">Вернуться ко входу</a></p>
</main>
{% endblock %}
