name: Деплой на сервер

# Пуш в main — и сервер обновляется сам.
# Ручной запуск доступен во вкладке Actions (кнопка Run workflow).
on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  # Адрес не секрет — он и так виден в DNS поддомена.
  # Секретом хранится только приватный ключ: Settings → Secrets → DEPLOY_KEY.
  DEPLOY_HOST: 130.49.146.66
  DEPLOY_USER: root

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Проверить, что секрет задан
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
        run: |
          if [ -z "$DEPLOY_KEY" ]; then
            echo "::error::Не задан секрет DEPLOY_KEY (Settings → Secrets and variables → Actions)"
            exit 1
          fi

      - name: Подготовить SSH-ключ
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          install -m 600 /dev/null ~/.ssh/deploy_key
          echo "${{ secrets.DEPLOY_KEY }}" > ~/.ssh/deploy_key
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Выполнить деплой
        run: |
          ssh -i ~/.ssh/deploy_key \
              -o IdentitiesOnly=yes \
              -o ConnectTimeout=20 \
              "$DEPLOY_USER@$DEPLOY_HOST" \
              'bash -s' < deploy/deploy.sh

      - name: Убрать ключ
        if: always()
        run: rm -f ~/.ssh/deploy_key
