# Конфиг transcriber.kahman.studio.
#
# Схема та же, что у leadgen: файл подключается внутрь секции http, TLS —
# внутри server-блоков. Ставить ПОСЛЕ выпуска сертификата (порядок — в bootstrap.sh).

# Перебор пароля: на страницу входа — 10 запросов в минуту с адреса.
limit_req_zone $binary_remote_addr zone=transcriber_login:10m rate=10r/m;

# --- HTTP: продление сертификата и переезд на HTTPS ---
server {
    listen 80;
    listen [::]:80;
    server_name transcriber.kahman.studio;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/transcriber.kahman.studio;
        default_type "text/plain";
    }

    location / {
        return 301 https://transcriber.kahman.studio$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name transcriber.kahman.studio;

    ssl_certificate /etc/letsencrypt/live/transcriber.kahman.studio/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/transcriber.kahman.studio/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    server_tokens off;

    # Заголовки безопасности (CSP, HSTS и др.) ставит само приложение.
    # Эти два nginx добавляет сам — чтобы они были и на его ошибках (413, 502),
    # а копии от приложения скрываем, иначе заголовок придёт дважды.
    proxy_hide_header X-Robots-Tag;
    proxy_hide_header X-Content-Type-Options;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header X-Content-Type-Options "nosniff" always;

    # Записи звонков: час разговора в m4a — около 30 МБ, запас на wav
    client_max_body_size 300m;
    client_body_timeout 300s;

    access_log /var/log/nginx/transcriber.access.log;
    error_log  /var/log/nginx/transcriber.error.log;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    # Перезаписываем, а не дописываем: значение из запроса клиента не доходит до приложения
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    location = /login {
        limit_req zone=transcriber_login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8780;
    }

    location = /login/code {
        limit_req zone=transcriber_login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8780;
    }

    location / {
        proxy_pass http://127.0.0.1:8780;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
